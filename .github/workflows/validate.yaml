---
name: validate

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - "**/*.json5"
      - "**/*.json"
      - .github/workflows/validate.yaml

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/renovatebot/renovate@sha256:64adaabe8ee3e34820c2b044b5f87e281aa278bf53e5d76df2ce800f9cc9407a
      options: --user 1001
    steps:
      # https://github.com/marketplace/actions/harden-runner
      - name: harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # https://github.com/marketplace/actions/checkout
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: validate renovate config
        run: |
          renovate-config-validator --strict .github/renovate-bot.json5
          find . -type f \
            \( -name '*.json5' -o -name '*.json' \) \
            -not -path './.git/*' \
            -not -path './.github/renovate-bot.json5' \
            -print0 \
            | xargs -0 renovate-config-validator --strict --no-global
