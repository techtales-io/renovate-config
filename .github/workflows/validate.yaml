---
name: validate

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - "**/*.json5"
      - "**/*.json"
      - .github/workflows/validate.yaml

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/renovatebot/renovate@sha256:9806d1b444f2b0b57d7c3b882d453b99c7494db07689c2e1abed8e6ae502b271
      options: --user 1001
    steps:
      # https://github.com/marketplace/actions/harden-runner
      - name: harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      # https://github.com/marketplace/actions/checkout
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: validate renovate config
        run: |
          renovate-config-validator --strict .github/renovate-bot.json5
          find . -type f \
            \( -name '*.json5' -o -name '*.json' \) \
            -not -path './.git/*' \
            -not -path './.github/renovate-bot.json5' \
            -print0 \
            | xargs -0 renovate-config-validator --strict --no-global
